<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>學華語向前走 - 詞彙忍者</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
    
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #1a202c;
            font-family: 'Noto Sans TC', sans-serif;
            touch-action: none; 
            user-select: none;
            -webkit-user-select: none;
        }

        #gameCanvas {
            display: block;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(to bottom, #2d3748, #1a202c);
            box-shadow: inset 0 0 100px rgba(0,0,0,0.5);
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            background-color: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            transition: opacity 0.3s ease;
            z-index: 10;
        }

        .hidden {
            opacity: 0;
            pointer-events: none;
        }

        .btn {
            background: linear-gradient(135deg, #f6e05e 0%, #d69e2e 100%);
            color: #744210;
            padding: 15px 40px;
            font-size: 1.5rem;
            font-weight: 900;
            border-radius: 9999px;
            box-shadow: 0 4px 15px rgba(214, 158, 46, 0.4);
            border: 2px solid #feebc8;
            transition: transform 0.1s, box-shadow 0.1s;
            cursor: pointer;
        }

        .btn:active {
            transform: scale(0.95);
            box-shadow: 0 2px 10px rgba(214, 158, 46, 0.4);
        }

        #hud {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            pointer-events: none;
            z-index: 5;
        }

        .hud-text {
            color: white;
            font-size: 1.5rem;
            font-weight: 900;
            text-shadow: 2px 2px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000;
        }

        @media (min-width: 768px) {
            .hud-text { font-size: 1.8rem; }
        }

        .lesson-btn {
            background: linear-gradient(135deg, #4fd1c5 0%, #319795 100%);
            color: white;
            padding: 12px 10px;
            font-size: 1.1rem;
            font-weight: 700;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(49, 151, 149, 0.4);
            border: 2px solid #e6fffa;
            transition: transform 0.1s, box-shadow 0.1s;
            cursor: pointer;
            width: 100%;
        }
        
        .lesson-btn:active {
            transform: scale(0.95);
            box-shadow: 0 2px 5px rgba(49, 151, 149, 0.4);
        }

        .lang-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.4);
            padding: 8px 20px;
            border-radius: 20px;
            cursor: pointer;
            z-index: 100;
            backdrop-filter: blur(5px);
            font-weight: bold;
            transition: all 0.2s;
        }
        .lang-btn:hover { background: rgba(255, 255, 255, 0.3); }

        .name-input {
            background: rgba(0, 0, 0, 0.5);
            border: 2px solid #4fd1c5;
            color: white;
            padding: 12px 20px;
            border-radius: 9999px;
            font-size: 1.2rem;
            text-align: center;
            outline: none;
            width: 100%;
            transition: border-color 0.2s;
        }
        .name-input:focus { border-color: #f6e05e; }

        /* 自訂滾動條 */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); border-radius: 10px; }
        ::-webkit-scrollbar-thumb { background: #4fd1c5; border-radius: 10px; }
    </style>
</head>
<body>
    <button class="lang-btn shadow-lg" onclick="toggleLanguage()">🌐 EN / 中文</button>

    <div id="hud">
        <div class="hud-text"><span data-i18n="score">分數: </span><span id="scoreDisplay">0</span></div>
        <div class="hud-text text-center" id="collectionHudText">
            <span id="collectionModeText" class="hidden text-yellow-300 block text-sm"></span>
            <span id="collectionCounterWrapper"><span data-i18n="collect">收集: </span><span id="collectedCount">0</span>/<span id="totalCount">0</span></span>
        </div>
        <div class="hud-text" id="livesDisplay">❤️❤️❤️</div>
    </div>

    <!-- 聽力挑戰 UI (全新設計：直接顯示注音拼音) -->
    <div id="targetUI" class="absolute top-16 left-1/2 transform -translate-x-1/2 z-10 hidden w-[90%] max-w-sm">
        <div class="bg-gray-900 bg-opacity-85 border-2 border-yellow-400 rounded-3xl p-4 w-full shadow-[0_10px_25px_rgba(0,0,0,0.8)] flex flex-col items-center backdrop-blur-md">
            <div data-i18n="target_instruction" class="text-yellow-300 text-sm font-bold mb-2 tracking-wide">點擊按鈕聽語音，切出正確的字！</div>
            
            <button onclick="replayTargetAudio()" class="bg-blue-600 hover:bg-blue-500 border-4 border-blue-300 text-white rounded-full w-16 h-16 shadow-[0_0_20px_rgba(59,130,246,0.6)] transition transform active:scale-95 flex items-center justify-center mb-3">
                <span class="text-3xl">🔊</span>
            </button>
            
            <div class="w-full text-center space-y-1 bg-black bg-opacity-50 rounded-xl p-3 border border-gray-700">
                <div id="targetZhuyin" class="text-green-400 text-xl md:text-2xl font-black tracking-widest leading-none"></div>
                <div id="targetPinyin" class="text-gray-300 text-lg md:text-xl font-mono leading-none mt-1"></div>
                <div id="targetEnglish" class="text-blue-300 text-base md:text-lg font-bold leading-none mt-2"></div>
            </div>
        </div>
    </div>

    <!-- 遊戲控制按鈕 (暫停) -->
    <div id="gameControls" class="absolute top-4 right-4 z-50 hidden">
        <button onclick="togglePause()" class="w-12 h-12 bg-blue-600 hover:bg-blue-500 text-white rounded-full border-2 border-blue-300 shadow-lg flex items-center justify-center text-2xl transition transform active:scale-95 opacity-80 hover:opacity-100">
            ⏸️
        </button>
    </div>

    <!-- 查閱本課圖鑑按鈕 -->
    <button id="vocabBtn" onclick="toggleVocabModal()" data-i18n="lesson_vocab_btn" class="absolute bottom-6 right-6 md:bottom-8 md:right-8 bg-indigo-600 hover:bg-indigo-700 text-white font-bold px-4 py-2 rounded-full shadow-lg z-50 text-sm md:text-base border-2 border-indigo-300 hidden transition transform active:scale-95">
        📖 本課生詞圖鑑
    </button>

    <!-- 生詞圖鑑彈出視窗 -->
    <div id="vocabModal" class="overlay hidden flex-col items-center justify-center" style="z-index: 100;">
        <div class="bg-gray-800 border-4 border-yellow-500 rounded-2xl p-6 max-w-lg w-full mx-4 shadow-2xl max-h-[80vh] flex flex-col">
            <h2 class="text-2xl font-black text-yellow-400 mb-2 text-center">
                <span id="modalLessonPrefix" data-i18n="lesson_prefix">第 </span><span id="modalLessonNum">1</span><span id="modalLessonSuffix" data-i18n="lesson_suffix_modal"> 課生詞收集冊</span>
            </h2>
            <p data-i18n="mode_desc4" class="text-gray-300 text-sm mb-4 text-center">切開飛上來的生詞來點亮它們！收集完全部即可過關！</p>
            <div id="vocabGrid" class="grid grid-cols-2 md:grid-cols-3 gap-2 overflow-y-auto p-2 flex-grow bg-gray-900 rounded-xl border border-gray-700">
            </div>
            <button class="btn mt-4 py-2 text-lg" data-i18n="continue_game" onclick="toggleVocabModal()">繼續遊戲</button>
        </div>
    </div>

    <!-- 全局圖鑑彈出視窗 -->
    <div id="globalVocabModal" class="overlay hidden flex-col items-center justify-center" style="z-index: 100;">
        <div class="bg-gray-800 border-4 border-purple-500 rounded-2xl p-4 md:p-6 max-w-4xl w-full mx-4 shadow-2xl h-[85vh] flex flex-col">
            <h2 data-i18n="global_col_title" class="text-3xl font-black text-purple-400 mb-4 text-center">我的生詞圖鑑</h2>
            <div id="globalVocabContainer" class="overflow-y-auto flex-grow bg-gray-900 rounded-xl border border-gray-700 p-4 space-y-6">
            </div>
            <button class="btn mt-4 py-2 text-lg bg-gray-500 border-gray-400 text-white" data-i18n="close_btn" onclick="toggleGlobalVocabModal()">關閉</button>
        </div>
    </div>

    <!-- 全新卡片式主畫面 -->
    <div id="startScreen" class="overlay overflow-y-auto py-10 px-4 flex items-center justify-center">
        <div class="flex flex-col lg:flex-row gap-6 w-full max-w-5xl items-stretch mt-10 md:mt-0">
            
            <!-- 左側卡片：設定與說明 -->
            <div class="bg-gray-800 bg-opacity-90 border-4 border-blue-400 rounded-3xl p-6 md:p-8 flex-1 flex flex-col shadow-2xl relative">
                <div class="text-center mb-6">
                    <h1 data-i18n="title" class="text-5xl md:text-6xl font-black text-transparent bg-clip-text bg-gradient-to-r from-yellow-300 to-red-500" style="filter: drop-shadow(2px 4px 4px rgba(0,0,0,0.8));">詞彙忍者</h1>
                    <h2 data-i18n="subtitle" class="text-lg md:text-xl text-blue-200 mt-2 font-bold">《學華語向前走》第二冊</h2>
                </div>
                
                <div class="space-y-4 mb-6">
                    <div>
                        <label class="block text-gray-400 text-sm font-bold mb-1 pl-2">忍者代號 (姓名)</label>
                        <input type="text" id="playerName" class="name-input" placeholder="輸入姓名 / Enter Name" onchange="savePlayerName(this.value)">
                    </div>
                    
                    <div>
                        <label class="block text-gray-400 text-sm font-bold mb-1 pl-2" data-i18n="speed_label">遊戲速度</label>
                        <select id="gameSpeedSelect" class="w-full bg-gray-700 text-yellow-300 border-2 border-gray-500 rounded-full px-4 py-3 font-bold outline-none text-center" onchange="setGameSpeed(this.value)">
                            <option value="0.75" data-i18n="speed_slow">🐢 慢速練習</option>
                            <option value="1.0" data-i18n="speed_normal" selected>🐇 正常挑戰</option>
                            <option value="1.15" data-i18n="speed_fast">🐎 忍者大師</option>
                        </select>
                    </div>

                    <button class="w-full bg-purple-600 hover:bg-purple-500 text-white font-bold py-3 px-4 rounded-full border-2 border-purple-300 shadow-lg transition transform active:scale-95" onclick="toggleGlobalVocabModal()">
                        <span data-i18n="collection_btn">📚 我的全域圖鑑</span>
                    </button>
                </div>

                <div class="mt-auto bg-gray-900 bg-opacity-50 p-4 rounded-2xl border border-gray-600">
                    <p class="text-gray-300 text-sm leading-relaxed">
                        <span data-i18n="mode_desc1" class="text-green-400 font-bold text-base block mb-1">🎧 聽力挑戰模式！</span>
                        <span data-i18n="mode_desc2">注意聽語音，<span class="text-yellow-300 font-bold">切開與語音相符的生詞！</span></span><br>
                        <span data-i18n="mode_desc3">切錯生詞或切到炸彈(💣)會扣命！沒命時請切水果補血。</span><br>
                        <span data-i18n="mode_desc4">收集完全部生詞即可過關！圖鑑內可聽造句。</span>
                    </p>
                </div>
                
                <div class="absolute -bottom-8 left-0 right-0 text-gray-500 text-xs font-medium text-center pointer-events-none">
                    Powered by Gemini | Sophia老師的AI練習本
                </div>
            </div>

            <!-- 右側卡片：關卡選擇 -->
            <div class="bg-gray-800 bg-opacity-90 border-4 border-green-500 rounded-3xl p-6 md:p-8 flex-[1.2] flex flex-col shadow-2xl">
                <h3 class="text-2xl font-black text-green-400 mb-4 text-center pb-2 border-b border-gray-600" data-i18n="select_lesson_title">選擇關卡</h3>
                
                <div class="grid grid-cols-2 md:grid-cols-3 gap-3 w-full" id="lessonButtonsContainer">
                    <!-- 動態生成 -->
                </div>
            </div>

        </div>
    </div>

    <!-- 過關畫面 -->
    <div id="winScreen" class="overlay hidden flex-col items-center justify-center">
        <h1 data-i18n="win_title" class="text-5xl md:text-7xl font-black text-transparent bg-clip-text bg-gradient-to-r from-green-300 to-yellow-300 mb-2 text-center" style="filter: drop-shadow(2px 4px 6px black);">太棒了！過關！</h1>
        <p class="text-2xl md:text-3xl text-white font-bold mb-6 text-center"><span data-i18n="win_desc1">你完成了第 </span><span id="winLessonText" class="text-green-400">X</span><span data-i18n="win_desc2"> 課的圖鑑收集！</span></p>
        
        <div class="flex flex-col md:flex-row gap-3 md:gap-4 mb-6">
            <button class="bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3 px-6 rounded-full shadow-lg border-2 border-indigo-300 transition transform active:scale-95" data-i18n="win_vocab_btn" onclick="toggleVocabModal()">📖 本次收集圖鑑</button>
            <button class="bg-purple-600 hover:bg-purple-500 text-white font-bold py-3 px-6 rounded-full shadow-lg border-2 border-purple-300 transition transform active:scale-95" data-i18n="win_global_btn" onclick="toggleGlobalVocabModal()">📚 我的全域圖鑑</button>
        </div>

        <div class="flex flex-col md:flex-row gap-3 md:gap-4">
            <button id="nextLessonBtn" data-i18n="next_lesson" class="btn" onclick="nextLesson()">下一課</button>
            <button data-i18n="back_menu" class="btn bg-gray-500 border-gray-400 text-white" style="background: linear-gradient(135deg, #a0aec0 0%, #718096 100%);" onclick="backToMenu()">回主選單</button>
        </div>
    </div>

    <!-- 暫停畫面 -->
    <div id="pauseScreen" class="overlay hidden flex-col items-center justify-center" style="z-index: 100;">
        <h1 data-i18n="paused" class="text-5xl md:text-6xl font-black text-blue-400 mb-8" style="text-shadow: 3px 3px 0 #000;">遊戲暫停</h1>
        <button data-i18n="resume" class="btn mb-4 bg-green-500 border-green-300 text-white" onclick="togglePause()">繼續遊戲</button>
        <button data-i18n="home" class="btn bg-gray-500 border-gray-400 text-white" style="background: linear-gradient(135deg, #a0aec0 0%, #718096 100%);" onclick="quitGame()">回主選單</button>
    </div>

    <!-- 自訂複習選單 -->
    <div id="customReviewModal" class="overlay hidden flex-col items-center justify-center" style="z-index: 100;">
        <div class="bg-gray-800 border-4 border-blue-500 rounded-2xl p-6 max-w-lg w-full mx-4 shadow-2xl flex flex-col">
            <h2 data-i18n="custom_title" class="text-2xl md:text-3xl font-black text-blue-400 mb-4 text-center">選擇要複習的課別</h2>
            <div id="customCheckboxGrid" class="grid grid-cols-3 md:grid-cols-4 gap-2 md:gap-3 mb-4">
                <!-- 動態生成 -->
            </div>
            <div id="customWarning" class="text-red-400 text-center mb-2 hidden font-bold" data-i18n="alert_no_selection">請至少選擇一課！</div>
            <div class="flex justify-between gap-2 mb-4">
                <button class="flex-1 bg-gray-600 hover:bg-gray-500 text-white py-2 rounded-lg font-bold text-sm md:text-base" data-i18n="select_all" onclick="selectAllCustom()">全選</button>
                <button class="flex-1 bg-gray-600 hover:bg-gray-500 text-white py-2 rounded-lg font-bold text-sm md:text-base" data-i18n="clear_all" onclick="clearAllCustom()">全不選</button>
                <button class="flex-1 bg-indigo-600 hover:bg-indigo-500 text-white py-2 rounded-lg font-bold text-sm md:text-base flex items-center justify-center gap-1" onclick="generateCustomLink()">
                    <span data-i18n="generate_link">🔗 複製連結</span>
                </button>
            </div>
            <div class="flex gap-2">
                <button class="flex-1 bg-gray-500 hover:bg-gray-400 text-white py-3 rounded-xl font-black text-lg" data-i18n="close_btn" onclick="toggleCustomModal()">取消</button>
                <button class="flex-1 bg-green-500 hover:bg-green-400 text-white py-3 rounded-xl font-black text-lg shadow-lg border-2 border-green-300" data-i18n="start_custom" onclick="startCustomGame()">開始複習</button>
            </div>
        </div>
    </div>

    <!-- 提示框 (Toast) -->
    <div id="toastNotification" class="fixed top-10 left-1/2 transform -translate-x-1/2 bg-green-500 text-white px-6 py-3 rounded-full shadow-lg font-bold text-lg z-[200] transition-opacity duration-300 opacity-0 pointer-events-none">
        <span id="toastText">連結已複製！</span>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        let currentLang = localStorage.getItem('ninja_lang') || 'zh';
        let globalWordCollection = JSON.parse(localStorage.getItem('ninja_collection')) || {};
        let playerName = localStorage.getItem('ninja_player_name') || '';
        let selectedGameSpeed = parseFloat(localStorage.getItem('ninja_speed')) || 1.0;

        // --- 完整生詞圖鑑資料庫 (注音, 拼音, 英文) ---
        const wordDictionary = {
            "新": { zhuyin: "ㄒㄧㄣ", pinyin: "xīn", en: "new" },

            "張莉": { zhuyin: "ㄓㄤ ㄌㄧˋ", pinyin: "zhāng lì", en: "Zhang Li (Name)" },
            "外公": { zhuyin: "ㄨㄞˋ ㄍㄨㄥ", pinyin: "wài gōng", en: "maternal grandfather" },
            "以前": { zhuyin: "ㄧˇ ㄑㄧㄢˊ", pinyin: "yǐ qián", en: "before" },
            "外婆": { zhuyin: "ㄨㄞˋ ㄆㄛˊ", pinyin: "wài pó", en: "maternal grandmother" },
            "做生意": { zhuyin: "ㄗㄨㄛˋ ㄕㄥ ㄧˋ", pinyin: "zuò shēng yì", en: "to do business" },
            "幫": { zhuyin: "ㄅㄤ", pinyin: "bāng", en: "to help" },
            "醫生": { zhuyin: "ㄧ ㄕㄥ", pinyin: "yī shēng", en: "doctor" },
            "工作": { zhuyin: "ㄍㄨㄥ ㄗㄨㄛˋ", pinyin: "gōng zuò", en: "to work, job" },
            "銀行": { zhuyin: "ㄧㄣˊ ㄏㄤˊ", pinyin: "yín háng", en: "bank" },
            "一樣": { zhuyin: "ㄧˊ ㄧㄤˋ", pinyin: "yí yàng", en: "same" },
            "電腦公司": { zhuyin: "ㄉㄧㄢˋ ㄋㄠˇ ㄍㄨㄥ ㄙ", pinyin: "diàn nǎo gōng sī", en: "computer company" },

            "以後": { zhuyin: "ㄧˇ ㄏㄡˋ", pinyin: "yǐ hòu", en: "in the future" },

        function t(key) {
            if (currentLang === 'en' && key === 'lesson_suffix') return '';
            return translations[currentLang][key] || key;
        }

        function toggleLanguage() {
            currentLang = currentLang === 'zh' ? 'en' : 'zh';
            localStorage.setItem('ninja_lang', currentLang);
            applyLanguage();
            renderLessonButtons();
            renderCustomCheckboxes();
        }

        function setGameSpeed(speed) {
            selectedGameSpeed = parseFloat(speed);
            localStorage.setItem('ninja_speed', selectedGameSpeed);
        }

        function applyLanguage() {
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (key === 'mode_desc2') {
                    el.innerHTML = t(key);
                } else {
                    el.innerText = t(key);
                }
            });
            document.getElementById('playerName').placeholder = currentLang === 'zh' ? "輸入姓名 / Enter Name" : "Enter Name / 輸入姓名";
            
            updateCollectionHUD();

            if(!isPlaying) renderGlobalCollection();
            
            if(isPlaying && targetWord !== "") {
                updateTargetUI(); 
            }
        }

        function savePlayerName(name) {
            playerName = name;
            localStorage.setItem('ninja_player_name', playerName);
        }

        function saveGlobalWord(word) {
            globalWordCollection[word] = (globalWordCollection[word] || 0) + 1;
            localStorage.setItem('ninja_collection', JSON.stringify(globalWordCollection));
        }

        function toggleGlobalVocabModal() {
            const modal = document.getElementById('globalVocabModal');
            if (modal.classList.contains('hidden')) {
                renderGlobalCollection();
                modal.classList.remove('hidden');
                modal.classList.add('flex');
            } else {
                modal.classList.add('hidden');
                modal.classList.remove('flex');
            }
        }

        function speakSentence(word) {
            let sentence = wordSentences[word] || word;
            speakWord(sentence);
        }

        function renderGlobalCollection() {
            const container = document.getElementById('globalVocabContainer');
            let html = '';
            
            for (let i = 1; i <= 12; i++) {
                const lessonWords = lessonData[i];
                let collectedInLesson = 0;
                
                let wordHtml = '';
                lessonWords.forEach(w => {
                    let count = globalWordCollection[w] || 0;
                    if (count > 0) collectedInLesson++;
                    
                    if (count > 0) {
                        wordHtml += `<div onclick="speakSentence('${w}')" class="flex flex-col items-center justify-center p-2 rounded-xl bg-green-900 border-2 border-green-500 text-green-100 shadow-inner cursor-pointer hover:bg-green-800 transition transform active:scale-95">
                            <span class="text-xl font-bold flex items-center gap-1">${w} <span class="text-sm">🔊</span></span>
                            <span class="text-xs bg-green-700 px-2 py-0.5 rounded-full mt-1">x${count}</span>
                        </div>`;
                    } else {
                        wordHtml += `<div class="flex flex-col items-center justify-center p-2 rounded-xl bg-gray-800 border-2 border-gray-700 text-gray-500">
                            <span class="text-xl font-bold filter blur-[2px] opacity-40">${w}</span>
                            <span class="text-xs bg-gray-700 px-2 py-0.5 rounded-full mt-1">${t('uncollected')}</span>
                        </div>`;
                    }
                });
                
                let progressColor = collectedInLesson === lessonWords.length ? 'text-green-400' : 'text-yellow-400';
                
                html += `
                <div class="bg-gray-800 p-5 rounded-2xl shadow-lg border border-gray-700">
                    <h3 class="text-2xl font-bold mb-4 ${progressColor} border-b-2 border-gray-600 pb-2 flex justify-between items-center">
                        <span>${t('lesson_prefix')}${i}${t('lesson_suffix')}</span>
                        <span class="text-base bg-black bg-opacity-40 px-4 py-1 rounded-full text-white">${collectedInLesson} / ${lessonWords.length}</span>
                    </h3>
                    <div class="grid grid-cols-3 md:grid-cols-6 gap-3">
                        ${wordHtml}
                    </div>
                </div>`;
            }
            container.innerHTML = html;
        }

        function renderLessonButtons() {
            const container = document.getElementById('lessonButtonsContainer');
            let html = '';
            for(let i = 1; i <= 12; i++) {
                html += `<button class="lesson-btn" onclick="startGame(${i})">${t('lesson_prefix')}${i}${t('lesson_suffix')}</button>`;
            }
            html += `<button class="lesson-btn col-span-2 md:col-span-3 mt-2 bg-blue-600 hover:bg-blue-500 border-blue-300 py-3" onclick="toggleCustomModal()">${t('custom_btn')}</button>`;
            container.innerHTML = html;
        }

        function toggleCustomModal() {
            const modal = document.getElementById('customReviewModal');
            if (modal.classList.contains('hidden')) {
                renderCustomCheckboxes();
                document.getElementById('customWarning').classList.add('hidden');
                modal.classList.remove('hidden');
                modal.classList.add('flex');
            } else {
                modal.classList.add('hidden');
                modal.classList.remove('flex');
            }
        }

        function drawBlade() {
            if (bladeTrail.length < 2) return; ctx.beginPath(); ctx.moveTo(bladeTrail[0].x, bladeTrail[0].y);
            for (let i = 1; i < bladeTrail.length; i++) ctx.lineTo(bladeTrail[i].x, bladeTrail[i].y);
            ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.lineWidth = 10 * scaleFactor; ctx.strokeStyle = 'rgba(255, 255, 255, 0.8)'; ctx.stroke();
            ctx.lineWidth = 4 * scaleFactor; ctx.strokeStyle = 'rgba(103, 232, 249, 1)'; ctx.stroke();

        function checkCollisions() {
            if (bladeTrail.length < 2) return; const p1 = bladeTrail[bladeTrail.length - 2]; const p2 = bladeTrail[bladeTrail.length - 1]; const velocityVector = { x: p2.x - p1.x, y: p2.y - p1.y };
            for (let i = 0; i < fruits.length; i++) { let f = fruits[i]; if (f.isCut) continue; const dist = distToSegment(f, p1, p2); if (dist < f.radius) f.cut(velocityVector); }
        }

        function distToSegment(p, v, w) {
            const l2 = dist2(v, w); if (l2 === 0) return Math.sqrt(dist2(p, v)); let t = ((p.x - v.x) * (w.x - v.x) + (p.y - v.y) * (w.y - v.y)) / l2; t = Math.max(0, Math.min(1, t));
            return Math.sqrt(dist2(p, { x: v.x + t * (w.x - v.x), y: v.y + t * (w.y - v.y) }));
        }
        function dist2(v, w) { return Math.pow(v.x - w.x, 2) + Math.pow(v.y - w.y, 2); }

                let speakerIcon = count > 0 ? `<span class="text-xs ml-1">🔊</span>` : "";
                
                gridHtml += `<div ${clickEvent} class="flex items-center justify-between p-2 rounded-lg border ${statusClass} ${interactiveClass}">
                    <span class="font-bold text-sm md:text-base flex items-center gap-1">${w}${speakerIcon}</span>${badge}</div>`;
            });
            document.getElementById('collectedCount').innerText = collected; document.getElementById('totalCount').innerText = total; document.getElementById('vocabGrid').innerHTML = gridHtml;
        }

        function pickNewTargetWord() {
            let uncollected = currentVocabList.filter(w => !wordCollection[w]);
            if (uncollected.length > 0) targetWord = uncollected[Math.floor(Math.random() * uncollected.length)];
            else targetWord = currentVocabList[Math.floor(Math.random() * currentVocabList.length)];
            updateTargetUI(); replayTargetAudio();
        }

        function updateTargetUI() {
            if (!targetWord) return;
            let info = wordDictionary[targetWord] || { zhuyin: "", pinyin: "", en: "" };
            document.getElementById('targetZhuyin').innerText = info.zhuyin; document.getElementById('targetPinyin').innerText = info.pinyin;
            document.getElementById('targetEnglish').innerText = currentLang === 'en' ? targetWord : info.en;
        }

        function replayTargetAudio() { if (targetWord) speakWord(targetWord); }

        function toggleVocabModal() {
            const modal = document.getElementById('vocabModal');
            if (modal.classList.contains('hidden')) { modal.classList.remove('hidden'); modal.classList.add('flex'); } else { modal.classList.add('hidden'); modal.classList.remove('flex'); }
        }

        function togglePause() {
            if (!isPlaying) return; isPaused = !isPaused;
            if (isPaused) { document.getElementById('pauseScreen').classList.remove('hidden'); document.getElementById('pauseScreen').classList.add('flex'); } else { document.getElementById('pauseScreen').classList.add('hidden'); document.getElementById('pauseScreen').classList.remove('flex'); gameLoop(); }
        }

        function quitGame() {
            isPaused = false; isPlaying = false; cancelAnimationFrame(animationId);
            document.getElementById('pauseScreen').classList.add('hidden'); document.getElementById('pauseScreen').classList.remove('flex');
            document.getElementById('gameControls').classList.add('hidden'); backToMenu();
        }

        function gameLoop() {
            if (!isPlaying || isPaused) return; ctx.clearRect(0, 0, width, height); frameCount++;
            let baseRate = Math.max(30, 90 - Math.floor(score / 5)); let spawnRate = Math.max(10, Math.floor(baseRate / selectedGameSpeed));

            if (frameCount % spawnRate === 0) {
                if (lives <= 0) { fruits.push(new HealFruit()); } else {
                    let numToSpawn = Math.random() > 0.7 ? 2 : 1; if(score > 40 && Math.random() > 0.7) numToSpawn = 3;
                    for(let i=0; i<numToSpawn; i++) {
                        if (lives < 3 && Math.random() < 0.15) { fruits.push(new HealFruit()); } else {
                            let bombChance = gameFlags.hard ? 0.25 : 0.15;
                            if (gameFlags.bomb && Math.random() < bombChance) { fruits.push(new Bomb()); } else {
                                let spawnTarget = Math.random() < 0.5; 
                                if (spawnTarget && targetWord) fruits.push(new WordFruit(targetWord)); else fruits.push(new WordFruit());
                            }
                        }
                    }
                }
            }

            for (let i = fruits.length - 1; i >= 0; i--) {
                let f = fruits[i]; f.update(); f.draw();
                if (f.isCut && (f.isBomb || f.isHeal)) { fruits.splice(i, 1); continue; }
                if (f.y > height + f.radius * 2) {
                    if (!f.isCut && !f.isBomb && !f.isHeal && f.word === targetWord) {
                        lives--; if (lives < 0) lives = 0; combo = 0; updateLivesDisplay(); ctx.fillStyle = 'rgba(255, 0, 0, 0.3)'; ctx.fillRect(0, 0, width, height); splashTexts.push(new SplashText(t('missed'), width/2, height - 100, '#FF3B30'));
                    }
                    fruits.splice(i, 1);
                }
            }

            for (let i = particles.length - 1; i >= 0; i--) { particles[i].update(); particles[i].draw(); if (particles[i].life <= 0) particles.splice(i, 1); }
            for (let i = splashTexts.length - 1; i >= 0; i--) { splashTexts[i].update(); splashTexts[i].draw(); if (splashTexts[i].life <= 0) splashTexts.splice(i, 1); }
            drawBlade(); if (!isSwiping && bladeTrail.length > 0) bladeTrail.shift();
            
            if (announcement.life > 0) {
                ctx.save(); let alpha = Math.min(1, announcement.life / 30); ctx.globalAlpha = alpha; ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.font = "900 36px 'Noto Sans TC'"; ctx.fillText(announcement.text, width / 2, height / 2); ctx.restore(); announcement.life--;
            }
            if (isPlaying && !isPaused) animationId = requestAnimationFrame(gameLoop);
        }

        function startGame(lessonInput = 0) {
            initToneAudio(); try { if ('speechSynthesis' in window) { let silentUtterance = new SpeechSynthesisUtterance(''); window.speechSynthesis.speak(silentUtterance); } } catch(e) {}
            if (Array.isArray(lessonInput) || lessonInput === 'custom') {
                currentLesson = 'custom'; if (Array.isArray(lessonInput)) currentCustomLessons = lessonInput;
                currentVocabList = currentCustomLessons.flatMap(i => lessonData[i]); currentVocabList = [...new Set(currentVocabList)]; wordCollection = {}; currentVocabList.forEach(w => wordCollection[w] = 0);
                document.getElementById('modalLessonPrefix').innerText = ""; document.getElementById('modalLessonNum').innerText = t('custom_win_text'); document.getElementById('modalLessonSuffix').innerText = currentLang === 'zh' ? "圖鑑" : " Collection";
            } else {
                currentLesson = lessonInput; currentVocabList = lessonData[lessonInput]; wordCollection = {}; currentVocabList.forEach(w => wordCollection[w] = 0);
                document.getElementById('modalLessonPrefix').innerText = t('lesson_prefix'); document.getElementById('modalLessonNum').innerText = lessonInput; document.getElementById('modalLessonSuffix').innerText = t('lesson_suffix_modal');
            }
            document.getElementById('vocabBtn').classList.remove('hidden'); updateCollectionHUD(); document.querySelector('#vocabModal .btn').innerText = t('continue_game'); document.querySelector('#vocabModal .btn').setAttribute('data-i18n', 'continue_game');
            document.getElementById('startScreen').classList.add('hidden'); document.getElementById('startScreen').classList.remove('flex'); document.getElementById('winScreen').classList.add('hidden'); document.getElementById('winScreen').classList.remove('flex');
            document.getElementById('targetUI').classList.remove('hidden'); document.getElementById('gameControls').classList.remove('hidden'); document.querySelector('.lang-btn').classList.add('hidden');
            score = 0; lives = 3; combo = 0; fruits = []; particles = []; splashTexts = []; bladeTrail = []; gameFlags = { bounce: false, bomb: false, hard: false }; announcement.life = 0; document.getElementById('scoreDisplay').innerText = score; updateLivesDisplay();
            isPlaying = true; frameCount = 0; targetWord = ""; document.getElementById('targetZhuyin').innerText = ""; document.getElementById('targetPinyin').innerText = ""; document.getElementById('targetEnglish').innerText = t('ready');
            setTimeout(() => pickNewTargetWord(), 1000); gameLoop();
        }

        function winGame() {
            isPlaying = false; cancelAnimationFrame(animationId);
            document.getElementById('vocabBtn').classList.add('hidden'); document.getElementById('targetUI').classList.add('hidden'); document.getElementById('gameControls').classList.add('hidden');
            if (currentLesson === 'custom') { document.getElementById('winLessonText').innerText = t('custom_win_text'); document.getElementById('nextLessonBtn').classList.add('hidden'); } else { document.getElementById('winLessonText').innerText = currentLesson; document.getElementById('nextLessonBtn').classList.remove('hidden'); }
            document.querySelector('#vocabModal .btn').innerText = t('close_btn'); document.querySelector('#vocabModal .btn').setAttribute('data-i18n', 'close_btn');
            document.getElementById('winScreen').classList.remove('hidden'); document.getElementById('winScreen').classList.add('flex'); document.querySelector('.lang-btn').classList.remove('hidden'); speakWord(t('win_speech'));
        }

        function backToMenu() {
            document.getElementById('winScreen').classList.add('hidden'); document.getElementById('winScreen').classList.remove('flex');
            document.getElementById('vocabModal').classList.add('hidden'); document.getElementById('vocabModal').classList.remove('flex');
            document.getElementById('vocabBtn').classList.add('hidden'); document.getElementById('targetUI').classList.add('hidden'); document.getElementById('gameControls').classList.add('hidden');
            document.getElementById('startScreen').classList.remove('hidden'); document.getElementById('startScreen').classList.add('flex'); document.querySelector('.lang-btn').classList.remove('hidden');
            ctx.fillStyle = '#1a202c'; ctx.fillRect(0, 0, width, height); score = 0; lives = 3; combo = 0; document.getElementById('scoreDisplay').innerText = score; updateLivesDisplay();
        }

        function nextLesson() { let next = currentLesson + 1; if (next > 12) next = 1; startGame(next); }
        ctx.fillStyle = '#1a202c'; ctx.fillRect(0, 0, canvas.width, canvas.height);
    </script>
</body>
</html>
