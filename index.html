<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>學華語向前走 - 詞彙忍者</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #1a202c;
            font-family: 'Noto Sans TC', sans-serif;
            touch-action: none; 
            user-select: none;
            -webkit-user-select: none;
        }

        #gameCanvas {
            display: block;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(to bottom, #2d3748, #1a202c);
            box-shadow: inset 0 0 100px rgba(0,0,0,0.5);
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(5px);
            transition: opacity 0.3s ease;
            z-index: 10;
        }

        .hidden {
            opacity: 0;
            pointer-events: none;
        }

        .btn {
            background: linear-gradient(135deg, #f6e05e 0%, #d69e2e 100%);
            color: #744210;
            padding: 15px 40px;
            font-size: 1.5rem;
            font-weight: 900;
            border-radius: 9999px;
            box-shadow: 0 4px 15px rgba(214, 158, 46, 0.4);
            border: 2px solid #feebc8;
            transition: transform 0.1s, box-shadow 0.1s;
            cursor: pointer;
        }

        .btn:active {
            transform: scale(0.95);
            box-shadow: 0 2px 10px rgba(214, 158, 46, 0.4);
        }

        #hud {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            pointer-events: none;
            z-index: 5;
        }

        .hud-text {
            color: white;
            font-size: 1.8rem;
            font-weight: 900;
            text-shadow: 2px 2px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000;
        }

        .lesson-btn {
            background: linear-gradient(135deg, #4fd1c5 0%, #319795 100%);
            color: white;
            padding: 10px 15px;
            font-size: 1.1rem;
            font-weight: 700;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(49, 151, 149, 0.4);
            border: 2px solid #e6fffa;
            transition: transform 0.1s, box-shadow 0.1s;
            cursor: pointer;
        }
        
        .lesson-btn:active {
            transform: scale(0.95);
            box-shadow: 0 2px 5px rgba(49, 151, 149, 0.4);
        }
        
        .all-btn {
            background: linear-gradient(135deg, #f6e05e 0%, #d69e2e 100%);
            color: #744210;
            border-color: #feebc8;
            box-shadow: 0 4px 15px rgba(214, 158, 46, 0.4);
        }

        .lang-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.4);
            padding: 5px 15px;
            border-radius: 20px;
            cursor: pointer;
            z-index: 100;
            backdrop-filter: blur(5px);
            font-weight: bold;
            transition: all 0.2s;
        }
        .lang-btn:hover { background: rgba(255, 255, 255, 0.3); }

        .name-input {
            background: rgba(0, 0, 0, 0.5);
            border: 2px solid #4fd1c5;
            color: white;
            padding: 10px 20px;
            border-radius: 9999px;
            font-size: 1.2rem;
            text-align: center;
            outline: none;
            width: 80%;
            max-width: 300px;
            margin-bottom: 10px;
            transition: border-color 0.2s;
        }
        .name-input:focus { border-color: #f6e05e; }
    </style>
</head>
<body>
    <button class="lang-btn" onclick="toggleLanguage()">🌐 EN / 中文</button>

    <div id="hud">
        <div class="hud-text"><span data-i18n="score">分數: </span><span id="scoreDisplay">0</span></div>
        <div class="hud-text" id="collectionHudText">
            <span id="collectionModeText" class="hidden text-yellow-300"></span>
            <span id="collectionCounterWrapper"><span data-i18n="collect">收集: </span><span id="collectedCount">0</span>/<span id="totalCount">0</span></span>
        </div>
        <div class="hud-text" id="livesDisplay">❤️❤️❤️</div>
    </div>

    <!-- 聽力挑戰 UI -->
    <div id="targetUI" class="absolute top-20 left-1/2 transform -translate-x-1/2 z-10 flex flex-col items-center hidden">
        <div data-i18n="target_instruction" class="text-yellow-300 text-lg md:text-xl font-black mb-1 shadow-black drop-shadow-md" style="text-shadow: 1px 1px 2px #000;">聽語音，切出正確的字！</div>
        <button onclick="replayTargetAudio()" class="bg-blue-600 hover:bg-blue-500 border-4 border-blue-300 text-white rounded-full px-6 py-2 text-2xl md:text-4xl font-black shadow-[0_0_15px_rgba(59,130,246,0.5)] transition transform active:scale-95 flex items-center gap-3">
            🔊 <span id="targetWordText" class="tracking-widest filter blur-md transition-all duration-300">???</span>
        </button>
        <button onclick="toggleWordVisibility()" data-i18n="toggle_hint" class="mt-2 bg-gray-800 bg-opacity-70 text-sm text-gray-200 px-3 py-1 rounded-full border border-gray-500 hover:bg-gray-700">👁️ 顯示/隱藏提示</button>
    </div>

    <!-- 遊戲控制按鈕 (暫停) -->
    <div id="gameControls" class="absolute top-6 right-6 z-50 hidden">
        <button onclick="togglePause()" class="w-12 h-12 bg-blue-600 hover:bg-blue-500 text-white rounded-full border-2 border-blue-300 shadow-lg flex items-center justify-center text-2xl transition transform active:scale-95 opacity-80 hover:opacity-100">
            ⏸️
        </button>
    </div>

    <!-- 查看本課生詞圖鑑的按鈕 -->
    <button id="vocabBtn" onclick="toggleVocabModal()" data-i18n="lesson_vocab_btn" class="absolute bottom-6 right-6 md:bottom-8 md:right-8 bg-indigo-600 hover:bg-indigo-700 text-white font-bold px-4 py-2 rounded-full shadow-lg z-50 text-sm md:text-base border-2 border-indigo-300 hidden transition transform active:scale-95">
        📖 本課生詞圖鑑
    </button>

    <!-- 生詞圖鑑彈出視窗 -->
    <div id="vocabModal" class="overlay hidden" style="background-color: rgba(0,0,0,0.85); z-index: 100;">
        <div class="bg-gray-800 border-4 border-yellow-500 rounded-2xl p-6 max-w-lg w-full mx-4 shadow-2xl max-h-[80vh] flex flex-col">
            <h2 class="text-2xl font-black text-yellow-400 mb-2 text-center"><span data-i18n="lesson_prefix">第 </span><span id="modalLessonNum">1</span><span id="modalLessonSuffix" data-i18n="lesson_suffix_modal"> 課生詞收集冊</span></h2>
            <p data-i18n="mode_desc4" class="text-gray-300 text-sm mb-4 text-center">切開飛上來的生詞來點亮它們！收集完全部即可過關！</p>
            <div id="vocabGrid" class="grid grid-cols-3 gap-2 overflow-y-auto p-2 flex-grow bg-gray-900 rounded-xl border border-gray-700">
                <!-- 動態填入生詞狀態 -->
            </div>
            <button class="btn mt-4 py-2 text-lg" data-i18n="continue_game" onclick="toggleVocabModal()">繼續遊戲</button>
        </div>
    </div>

    <!-- 全局圖鑑彈出視窗 -->
    <div id="globalVocabModal" class="overlay hidden" style="background-color: rgba(0,0,0,0.9); z-index: 100;">
        <div class="bg-gray-800 border-4 border-purple-500 rounded-2xl p-4 md:p-6 max-w-3xl w-full mx-4 shadow-2xl h-[85vh] flex flex-col">
            <h2 data-i18n="global_col_title" class="text-3xl font-black text-purple-400 mb-4 text-center">我的生詞圖鑑</h2>
            <div id="globalVocabContainer" class="overflow-y-auto flex-grow bg-gray-900 rounded-xl border border-gray-700 p-4 space-y-6">
                <!-- 動態填入全課生詞狀態 -->
            </div>
            <button class="btn mt-4 py-2 text-lg bg-gray-500" data-i18n="close_btn" onclick="toggleGlobalVocabModal()">關閉</button>
        </div>
    </div>

    <div id="startScreen" class="overlay">
        <h1 data-i18n="title" class="text-5xl md:text-7xl font-black text-transparent bg-clip-text bg-gradient-to-r from-yellow-300 to-red-500 mb-2 text-center" style="filter: drop-shadow(2px 4px 6px black);">
            詞彙忍者
        </h1>
        <h2 data-i18n="subtitle" class="text-xl md:text-2xl text-white mb-4 font-bold text-center px-4">
            《學華語向前走》第二冊
        </h2>
        
        <!-- 姓名輸入與全域圖鑑 -->
        <div class="flex flex-col items-center w-full mb-4">
            <input type="text" id="playerName" class="name-input" placeholder="輸入姓名 / Enter Name" onchange="savePlayerName(this.value)">
            <button class="lesson-btn mt-2 bg-purple-600 hover:bg-purple-500 border-purple-300" onclick="toggleGlobalVocabModal()">
                <span data-i18n="collection_btn">📚 我的圖鑑</span>
            </button>
        </div>

        <p class="text-gray-300 mb-4 max-w-md text-center px-4 leading-relaxed text-sm md:text-base">
            <span data-i18n="mode_desc1" class="text-blue-300 font-bold text-lg">🎧 聽力挑戰模式！</span><br>
            <span data-i18n="mode_desc2">注意聽語音，<span class="text-yellow-300 font-bold">切開與語音相符的生詞！</span></span><br>
            <span data-i18n="mode_desc3">切錯生詞或切到炸彈(💣)會扣命！</span><br>
            <span data-i18n="mode_desc4">收集完全部生詞即可過關！</span>
        </p>

        <div class="grid grid-cols-3 md:grid-cols-4 gap-2.5 w-full max-w-2xl px-4 mt-2" id="lessonButtonsContainer">
            <!-- 關卡按鈕動態生成以支援多語系 -->
        </div>
        
        <div class="absolute bottom-3 md:bottom-5 text-gray-400 text-xs md:text-sm font-medium tracking-wide text-center w-full pointer-events-none drop-shadow-md">
            Powered by Gemini | Sophia老師的AI練習本
        </div>
    </div>

    <div id="gameOverScreen" class="overlay hidden">
        <h1 data-i18n="game_over" class="text-6xl font-black text-red-500 mb-2" style="text-shadow: 3px 3px 0 #000;">遊戲結束</h1>
        <p class="text-3xl text-white font-bold mb-8"><span data-i18n="final_score">最終分數: </span><span id="finalScore" class="text-yellow-400">0</span></p>
        <button data-i18n="play_again" class="btn mb-4" onclick="resetGame()">再玩一次</button>
        <button data-i18n="back_menu" class="btn bg-gray-500 border-gray-400 text-white" style="background: linear-gradient(135deg, #a0aec0 0%, #718096 100%);" onclick="backToMenu()">回主選單</button>
    </div>

    <div id="winScreen" class="overlay hidden">
        <h1 data-i18n="win_title" class="text-5xl md:text-7xl font-black text-transparent bg-clip-text bg-gradient-to-r from-green-300 to-yellow-300 mb-2 text-center" style="filter: drop-shadow(2px 4px 6px black);">太棒了！過關！</h1>
        <p class="text-2xl md:text-3xl text-white font-bold mb-6 text-center"><span data-i18n="win_desc1">你完成了第 </span><span id="winLessonText" class="text-green-400">X</span><span data-i18n="win_desc2"> 課的圖鑑收集！</span></p>
        <button data-i18n="next_lesson" class="btn mb-4" onclick="nextLesson()">下一課</button>
        <button data-i18n="back_menu" class="btn bg-gray-500 border-gray-400 text-white" style="background: linear-gradient(135deg, #a0aec0 0%, #718096 100%);" onclick="backToMenu()">回主選單</button>
    </div>

    <!-- 暫停畫面 -->
    <div id="pauseScreen" class="overlay hidden" style="background-color: rgba(0,0,0,0.85); z-index: 100;">
        <h1 data-i18n="paused" class="text-5xl md:text-6xl font-black text-blue-400 mb-8" style="text-shadow: 3px 3px 0 #000;">遊戲暫停</h1>
        <button data-i18n="resume" class="btn mb-4 bg-green-500 border-green-300 text-white" onclick="togglePause()">繼續遊戲</button>
        <button data-i18n="home" class="btn bg-gray-500 border-gray-400 text-white" style="background: linear-gradient(135deg, #a0aec0 0%, #718096 100%);" onclick="quitGame()">回主選單</button>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        let currentLang = localStorage.getItem('ninja_lang') || 'zh';
        let globalWordCollection = JSON.parse(localStorage.getItem('ninja_collection')) || {};
        let playerName = localStorage.getItem('ninja_player_name') || '';

        const translations = {
            zh: {
                title: "詞彙忍者",
                subtitle: "《學華語向前走》第二冊",
                mode_desc1: "🎧 聽力挑戰模式！",
                mode_desc2: "注意聽語音，<span class='text-yellow-300 font-bold'>切開與語音相符的生詞！</span>",
                mode_desc3: "切錯生詞或切到炸彈(💣)會扣命！",
                mode_desc4: "收集完全部生詞即可過關！",
                collection_btn: "📚 我的圖鑑",
                score: "分數: ",
                collect: "收集: ",
                target_instruction: "聽語音，切出正確的字！",
                toggle_hint: "👁️ 顯示/隱藏提示",
                lesson_vocab_btn: "📖 本課生詞圖鑑",
                lesson_prefix: "第 ",
                lesson_suffix: " 課",
                lesson_suffix_modal: " 課生詞收集冊",
                continue_game: "繼續遊戲",
                global_col_title: "我的生詞圖鑑",
                close_btn: "關閉",
                game_over: "遊戲結束",
                final_score: "最終分數: ",
                play_again: "再玩一次",
                back_menu: "回主選單",
                win_title: "太棒了！過關！",
                win_desc1: "你完成了第 ",
                win_desc2: " 課的圖鑑收集！",
                next_lesson: "下一課",
                all_btn: "🍉 綜合挑戰 (全部 1~12 課)",
                correct: "⭕ 正確!",
                collected: "✨ 收集!",
                wrong: "❌ 切錯了!",
                missed: "⚠️ 漏掉了!",
                minus_life: "-1 命",
                bounce_mod: "⚡ 彈跳模式啟動！生詞會反彈",
                bomb_mod: "💣 注意炸彈！切到會扣命！",
                hard_mod: "🔥 忍者大師！速度加快！",
                uncollected: "未收集",
                ready: "準備...",
                win_speech: "太棒了，所有生詞都收集到了，過關！",
                wrong_speech: "不對",
                bomb_speech: "哎呀",
                comprehensive_mode: "綜合挑戰模式",
                paused: "遊戲暫停",
                resume: "繼續遊戲",
                home: "回主選單"
            },
            en: {
                title: "Vocab Ninja",
                subtitle: "Let's Learn Mandarin - Vol 2",
                mode_desc1: "🎧 Listening Challenge!",
                mode_desc2: "Listen carefully and <span class='text-yellow-300 font-bold'>slice the matching word!</span>",
                mode_desc3: "Slicing wrong words or bombs (💣) costs a life!",
                mode_desc4: "Collect all words to pass the level!",
                collection_btn: "📚 My Collection",
                score: "Score: ",
                collect: "Collected: ",
                target_instruction: "Listen & slice the correct word!",
                toggle_hint: "👁️ Toggle Hint",
                lesson_vocab_btn: "📖 Lesson Vocab",
                lesson_prefix: "Lesson ",
                lesson_suffix: "",
                lesson_suffix_modal: " Collection",
                continue_game: "Continue",
                global_col_title: "My Vocab Collection",
                close_btn: "Close",
                game_over: "Game Over",
                final_score: "Final Score: ",
                play_again: "Play Again",
                back_menu: "Main Menu",
                win_title: "Awesome! Cleared!",
                win_desc1: "You completed Lesson ",
                win_desc2: " collection!",
                next_lesson: "Next Lesson",
                all_btn: "🍉 All Lessons Challenge",
                correct: "⭕ Correct!",
                collected: "✨ Collected!",
                wrong: "❌ Wrong!",
                missed: "⚠️ Missed!",
                minus_life: "-1 Life",
                bounce_mod: "⚡ Bounce Mode! Words will bounce",
                bomb_mod: "💣 Watch out for bombs!",
                hard_mod: "🔥 Ninja Master! Speed up!",
                uncollected: "Locked",
                ready: "Ready...",
                win_speech: "Great job, all words collected, level passed!",
                wrong_speech: "Wrong",
                bomb_speech: "Oops",
                comprehensive_mode: "Comprehensive Challenge",
                paused: "Game Paused",
                resume: "Resume",
                home: "Main Menu"
            }
        };

        function t(key) {
            return translations[currentLang][key] || key;
        }

        function toggleLanguage() {
            currentLang = currentLang === 'zh' ? 'en' : 'zh';
            localStorage.setItem('ninja_lang', currentLang);
            applyLanguage();
            renderLessonButtons();
        }

        function applyLanguage() {
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (key === 'mode_desc2') {
                    el.innerHTML = t(key);
                } else {
                    el.innerText = t(key);
                }
            });
            document.getElementById('playerName').placeholder = currentLang === 'zh' ? "輸入姓名 / Enter Name" : "Enter Name / 輸入姓名";
            
            updateCollectionHUD();

            if(!isPlaying) renderGlobalCollection();
            
            if(isPlaying && targetWord === "") {
                document.getElementById('targetWordText').innerText = t('ready');
            }
        }

        function savePlayerName(name) {
            playerName = name;
            localStorage.setItem('ninja_player_name', playerName);
        }

        function saveGlobalWord(word) {
            globalWordCollection[word] = (globalWordCollection[word] || 0) + 1;
            localStorage.setItem('ninja_collection', JSON.stringify(globalWordCollection));
        }

        function toggleGlobalVocabModal() {
            const modal = document.getElementById('globalVocabModal');
            if (modal.classList.contains('hidden')) {
                renderGlobalCollection();
                modal.classList.remove('hidden');
            } else {
                modal.classList.add('hidden');
            }
        }

        function renderGlobalCollection() {
            const container = document.getElementById('globalVocabContainer');
            let html = '';
            
            for (let i = 1; i <= 12; i++) {
                const lessonWords = lessonData[i];
                let collectedInLesson = 0;
                
                let wordHtml = '';
                lessonWords.forEach(w => {
                    let count = globalWordCollection[w] || 0;
                    if (count > 0) collectedInLesson++;
                    
                    if (count > 0) {
                        wordHtml += `<div class="flex flex-col items-center justify-center p-2 rounded bg-green-900 border border-green-500 text-green-100">
                            <span class="text-lg font-bold">${w}</span>
                            <span class="text-xs bg-green-700 px-2 rounded-full mt-1">x${count}</span>
                        </div>`;
                    } else {
                        wordHtml += `<div class="flex flex-col items-center justify-center p-2 rounded bg-gray-800 border border-gray-700 text-gray-500">
                            <span class="text-lg font-bold filter blur-[2px] opacity-50">${w}</span>
                            <span class="text-xs bg-gray-700 px-2 rounded-full mt-1">${t('uncollected')}</span>
                        </div>`;
                    }
                });
                
                let progressColor = collectedInLesson === lessonWords.length ? 'text-green-400' : 'text-yellow-400';
                
                html += `
                <div class="bg-gray-800 p-4 rounded-xl shadow-inner">
                    <h3 class="text-xl font-bold mb-3 ${progressColor} border-b border-gray-600 pb-2">
                        ${t('lesson_prefix')}${i}${t('lesson_suffix')} 
                        <span class="text-sm float-right bg-black bg-opacity-30 px-3 py-1 rounded-full">${collectedInLesson} / ${lessonWords.length}</span>
                    </h3>
                    <div class="grid grid-cols-3 md:grid-cols-5 gap-2">
                        ${wordHtml}
                    </div>
                </div>`;
            }
            container.innerHTML = html;
        }

        function renderLessonButtons() {
            const container = document.getElementById('lessonButtonsContainer');
            let html = '';
            for(let i = 1; i <= 12; i++) {
                html += `<button class="lesson-btn" onclick="startGame(${i})">${t('lesson_prefix')}${i}${t('lesson_suffix')}</button>`;
            }
            html += `<button class="lesson-btn all-btn col-span-3 md:col-span-4 mt-1" onclick="startGame(0)">${t('all_btn')}</button>`;
            container.innerHTML = html;
        }

        window.addEventListener('DOMContentLoaded', () => {
            document.getElementById('playerName').value = playerName;
            renderLessonButtons();
            applyLanguage();
        });

        const lessonData = {
            1: ["比較","大家","方友朋","高興","跟","歡迎","今年","介紹","自己","看書","認識","現在","新","學","游泳","最","華語","張莉"],
            2: ["幫","電腦公司","工作","上班","外公","外婆","一樣","以前","銀行","醫生","做生意"],
            3: ["冰淇淋","超級市場","東西","附近","可以","米","買","牛肉","巧克力","青菜","糖果","要","魚"],
            4: ["出去","蛋炒飯","餓","漢堡","快點","了","麵","薯條","湯","晚餐","先","已經","玉米","再","週末"],
            5: ["變","不錯","白色","春天","草","紅色","黃","還是","花","了","綠色","漂亮","秋天","時候","樹葉","天氣","院子","顏色","舒服"],
            6: ["拜年","放鞭炮","給","紅包","會","每","那天","年糕","如果","說","台灣","貼春聯","新年","下","星期","華人","農曆"],

            10: ["本來","法國","舅舅","看","旅行","紐約","臺北","臺南","退休","一次","住在","暑假"],
            11: ["不但","脖子","長頸鹿","大象","動物園","猴子","看到","老虎","胖","企鵝","玩","熊貓","希望","這一次","長","真"],
            12: ["啊","過來","很久","好好","看起來","沒問題","上課","說話","瘦","網路","寫","信","有意思","一定","影像","長高"]

        let currentVocabList = [];
        let currentLesson = 0;
        let wordCollection = {};

        let targetWord = "";
        let isTextHidden = true;

        const fruitColors = ['#FF3B30', '#FF9500', '#FFCC00', '#4CD964', '#5AC8FA', '#007AFF', '#5856D6', '#FF2D55', '#E02020', '#F7B500'];

        let width, height;
        let score = 0;
        let lives = 3;
        let isPlaying = false;
        let isPaused = false;
        let animationId;

        let isAudioReady = false;
        let explosionSynth;
        let sliceSynth;
        let errorSynth;

        function initToneAudio() {
            if (isAudioReady) return;
            Tone.start();
            
            explosionSynth = new Tone.NoiseSynth({
                noise: { type: "brown" },
                envelope: { attack: 0.01, decay: 0.5, sustain: 0, release: 0.2 }
            }).toDestination();
            explosionSynth.volume.value = -5;

            // Use PolySynth to prevent "Start time must be strictly greater than previous start time"
            sliceSynth = new Tone.PolySynth(Tone.Synth, {
                oscillator: { type: "triangle" },
                envelope: { attack: 0.005, decay: 0.1, sustain: 0, release: 0.1 }
            }).toDestination();
            sliceSynth.volume.value = -2;

            errorSynth = new Tone.Synth({
                oscillator: { type: "sawtooth" },
                envelope: { attack: 0.01, decay: 0.2, sustain: 0, release: 0.2 }
            }).toDestination();
            errorSynth.volume.value = -5;

            isAudioReady = true;
        }

        function playExplosionSound() {
            if (isAudioReady && explosionSynth) {
                explosionSynth.triggerAttackRelease("4n", Tone.now());
            }
        }

        function playSliceSound() {
            if (isAudioReady && sliceSynth) {
                let now = Tone.now();
                sliceSynth.triggerAttackRelease("G6", "16n", now);
                sliceSynth.triggerAttackRelease("C6", "16n", now + 0.04);
            }
        }
        
        function playErrorSound() {
            if (isAudioReady && errorSynth) {
                errorSynth.triggerAttackRelease("C3", "8n", Tone.now());
            }
        }

        let fruits = [];
        let particles = [];
        let splashTexts = [];
        
        let bladeTrail = [];
        const MAX_TRAIL_LENGTH = 10;
        let isSwiping = false;

        let gameFlags = { bounce: false, bomb: false, hard: false };
        let announcement = { text: "", life: 0 };

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
        }
        window.addEventListener('resize', resize);
        resize();

        function speakWord(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'zh-TW';
                utterance.rate = 1.2;
                window.speechSynthesis.speak(utterance);
            }
        }

        function announce(text) {
            announcement.text = text;
            announcement.life = 150; 
        }

        class WordFruit {
            constructor(specificWord = null) {
                this.isBomb = false;
                this.word = specificWord || currentVocabList[Math.floor(Math.random() * currentVocabList.length)];
                this.color = fruitColors[Math.floor(Math.random() * fruitColors.length)];
                this.radius = 40 + (this.word.length - 1) * 15;
                
                this.x = Math.random() * (width - this.radius * 2) + this.radius;
                this.y = height + this.radius;
                
                this.vx = (Math.random() - 0.5) * 6;
                let jumpBoost = gameFlags.hard ? 2 : 0;
                this.vy = -(Math.random() * 4 + 14 + jumpBoost) * (height / 800); 
                
                this.rotation = Math.random() * Math.PI * 2;
                this.rotationSpeed = (Math.random() - 0.5) * 0.1;
                
                this.isCut = false;
                this.halves = [];

                this.canBounce = gameFlags.hard ? (Math.random() > 0.2) : (gameFlags.bounce ? Math.random() > 0.4 : false);
            }

            update() {
                if (!this.isCut) {
                    this.x += this.vx;
                    this.y += this.vy;
                    this.vy += 0.25; 
                    this.rotation += this.rotationSpeed;

                    if (this.canBounce) {
                        if (this.x - this.radius < 0) {
                            this.x = this.radius;
                            this.vx *= -0.9; 
                        } else if (this.x + this.radius > width) {
                            this.x = width - this.radius;
                            this.vx *= -0.9;
                        }
                    }
                } else {
                    for (let half of this.halves) {
                        half.x += half.vx;
                        half.y += half.vy;
                        half.vy += 0.3;
                        half.rotation += half.rotationSpeed;
                    }
                }
            }

            draw() {
                if (!this.isCut) {
                    ctx.save();
                    ctx.translate(this.x, this.y);
                    ctx.rotate(this.rotation);
                    
                    ctx.beginPath();
                    ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
                    ctx.fillStyle = this.color;
                    ctx.fill();
                    ctx.lineWidth = 4;
                    ctx.strokeStyle = '#fff';
                    ctx.stroke();

                    ctx.beginPath();
                    ctx.arc(-this.radius*0.3, -this.radius*0.3, this.radius*0.2, 0, Math.PI * 2);
                    ctx.fillStyle = 'rgba(255,255,255,0.3)';
                    ctx.fill();

                    ctx.fillStyle = '#FFFFFF';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    let fontSize = this.radius * 0.6;
                    if(this.word.length > 3) fontSize = this.radius * 0.45;
                    ctx.font = `900 ${fontSize}px 'Noto Sans TC'`;
                    ctx.shadowColor = 'rgba(0,0,0,0.5)';
                    ctx.shadowBlur = 4;
                    ctx.fillText(this.word, 0, 0);
                    
                    ctx.restore();
                } else {
                    for (let half of this.halves) {
                        ctx.save();
                        ctx.translate(half.x, half.y);
                        ctx.rotate(half.rotation);
                        
                        ctx.beginPath();
                        ctx.arc(0, 0, this.radius, half.startAngle, half.endAngle);
                        ctx.fillStyle = this.color;
                        ctx.fill();
                        ctx.lineWidth = 4;
                        ctx.strokeStyle = '#fff';
                        ctx.stroke();

                        ctx.restore();
                    }
                }
            }

            cut(velocityVector) {
                this.isCut = true;
                let angle = Math.atan2(velocityVector.y, velocityVector.x);
                
                this.halves = [
                    {
                        x: this.x, y: this.y,
                        vx: this.vx + Math.cos(angle - Math.PI/2) * 3,
                        vy: this.vy + Math.sin(angle - Math.PI/2) * 3,
                        rotation: this.rotation,
                        rotationSpeed: this.rotationSpeed - 0.1,
                        startAngle: angle,
                        endAngle: angle + Math.PI
                    },
                    {
                        x: this.x, y: this.y,
                        vx: this.vx + Math.cos(angle + Math.PI/2) * 3,
                        vy: this.vy + Math.sin(angle + Math.PI/2) * 3,
                        rotation: this.rotation,
                        rotationSpeed: this.rotationSpeed + 0.1,
                        startAngle: angle + Math.PI,
                        endAngle: angle + Math.PI * 2
                    }
                ];

                if (this.word === targetWord) {
                    // Correct slice!
                    playSliceSound(); 
                    
                    for(let i=0; i<8; i++) {
                        particles.push(new Particle(this.x, this.y, this.color));
                    }
                    splashTexts.push(new SplashText(t('correct'), this.x, this.y, '#34D399'));
                    
                    score++;
                    document.getElementById('scoreDisplay').innerText = score;

                    // 記錄到全域圖鑑
                    saveGlobalWord(this.word);

                    if (currentLesson !== 0 && wordCollection[this.word] !== undefined) {
                        if (wordCollection[this.word] === 0) {
                            splashTexts.push(new SplashText(t('collected'), this.x, this.y - 30, '#34D399'));
                        }
                        wordCollection[this.word]++;
                        updateCollectionHUD();
                    }

                    checkDifficultyProgress();

                    let allCollected = true;
                    if (currentLesson !== 0) {
                        for (let w of currentVocabList) {
                            if (!wordCollection[w] || wordCollection[w] < 1) {
                                allCollected = false;
                                break;
                            }
                        }
                    } else {
                        allCollected = false; // 綜合模式無盡
                    }
                    
                    if (allCollected) {
                        setTimeout(() => winGame(), 600);
                    } else {
                        setTimeout(() => pickNewTargetWord(), 300); // 延遲一下再出下一題
                    }
                } else {
                    // Wrong slice!
                    speakWord(t('wrong_speech'));
                    playErrorSound();
                    
                    for(let i=0; i<8; i++) {
                        particles.push(new Particle(this.x, this.y, '#FF3B30'));
                    }
                    splashTexts.push(new SplashText(t('wrong'), this.x, this.y, '#FF3B30'));
                    
                    lives--;
                    updateLivesDisplay();
                    
                    ctx.fillStyle = 'rgba(255, 0, 0, 0.6)';
                    ctx.fillRect(0, 0, width, height);
                    
                    if (lives <= 0) {
                        setTimeout(() => endGame(), 300);
                    }
                }
            }
        }

        class Bomb {
            constructor() {
                this.isBomb = true;
                this.radius = 35;
                this.x = Math.random() * (width - this.radius * 2) + this.radius;
                this.y = height + this.radius;
                this.vx = (Math.random() - 0.5) * 6;
                let jumpBoost = gameFlags.hard ? 2 : 0;
                this.vy = -(Math.random() * 4 + 14 + jumpBoost) * (height / 800); 
                
                this.rotation = Math.random() * Math.PI * 2;
                this.rotationSpeed = (Math.random() - 0.5) * 0.05;
                
                this.isCut = false;
                this.canBounce = (Math.random() > 0.5);
            }

            update() {
                if (this.isCut) return; 
                this.x += this.vx;
                this.y += this.vy;
                this.vy += 0.25;
                this.rotation += this.rotationSpeed;
                
                if (this.canBounce) {
                    if (this.x - this.radius < 0) {
                        this.x = this.radius;
                        this.vx *= -0.9;
                    } else if (this.x + this.radius > width) {
                        this.x = width - this.radius;
                        this.vx *= -0.9;
                    }
                }
            }

            draw() {
                if (this.isCut) return;
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation);
                
                ctx.beginPath();
                ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = '#111';
                ctx.fill();
                ctx.lineWidth = 3;
                ctx.strokeStyle = '#e53e3e';
                ctx.stroke();
                
                ctx.beginPath();
                ctx.arc(-this.radius*0.3, -this.radius*0.3, this.radius*0.2, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(255,255,255,0.2)';
                ctx.fill();
                
                ctx.fillStyle = '#FFFFFF';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.font = `900 ${this.radius * 0.8}px 'Noto Sans TC'`;
                ctx.fillText("💣", 0, 0);
                
                ctx.restore();
            }

            cut(velocityVector) {
                this.isCut = true;
                speakWord(t('bomb_speech'));
                playExplosionSound();
                
                for(let i=0; i<20; i++) {
                    particles.push(new Particle(this.x, this.y, '#FF3B30', true));
                }
                splashTexts.push(new SplashText(t('minus_life'), this.x, this.y, '#FF3B30'));
                
                lives--;
                updateLivesDisplay();
                
                ctx.fillStyle = 'rgba(255, 0, 0, 0.6)';
                ctx.fillRect(0, 0, width, height);
                
                if (lives <= 0) {
                    endGame();
                }
            }
        }

        class Particle {
            constructor(x, y, color, isExplosion = false) {
                this.x = x;
                this.y = y;
                this.color = color;
                this.radius = Math.random() * (isExplosion ? 8 : 5) + 3;
                let angle = Math.random() * Math.PI * 2;
                let speed = Math.random() * (isExplosion ? 10 : 5) + 2;
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;
                this.life = 1.0;
                this.decay = isExplosion ? 0.03 : 0.02;
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.vy += 0.2; 
                this.life -= this.decay;
            }
            draw() {
                ctx.save();
                ctx.globalAlpha = this.life;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
                ctx.restore();
            }
        }

        class SplashText {
            constructor(text, x, y, color = '#fbbf24') {
                this.text = text;
                this.x = x;
                this.y = y;
                this.color = color;
                this.life = 1.0;
                this.vy = -2;
            }
            update() {
                this.y += this.vy;
                this.life -= 0.03;
            }
            draw() {
                ctx.save();
                ctx.globalAlpha = this.life;
                ctx.fillStyle = this.color; 
                ctx.font = "900 36px 'Noto Sans TC'";
                ctx.strokeStyle = '#000';
                ctx.lineWidth = 4;
                ctx.strokeText(this.text, this.x, this.y);
                ctx.fillText(this.text, this.x, this.y);
                ctx.restore();
            }
        }

        function checkDifficultyProgress() {
            if (score >= 15 && !gameFlags.bounce) {
                gameFlags.bounce = true;
                announce(t('bounce_mod'));
            }
            if (score >= 30 && !gameFlags.bomb) {
                gameFlags.bomb = true;
                announce(t('bomb_mod'));
            }
            if (score >= 50 && !gameFlags.hard) {
                gameFlags.hard = true;
                announce(t('hard_mod'));
            }
        }

        function addTrailPoint(x, y) {
            bladeTrail.push({x, y});
            if (bladeTrail.length > MAX_TRAIL_LENGTH) {
                bladeTrail.shift();
            }
            checkCollisions();
        }

        function clearTrail() {
            bladeTrail = [];
        }

        canvas.addEventListener('mousedown', (e) => {
            if (!isPlaying || isPaused) return;
            isSwiping = true;
            addTrailPoint(e.clientX, e.clientY);
        });
        canvas.addEventListener('mousemove', (e) => {
            if (!isPlaying || !isSwiping || isPaused) return;
            addTrailPoint(e.clientX, e.clientY);
        });
        window.addEventListener('mouseup', () => {
            isSwiping = false;
            clearTrail();
        });

        canvas.addEventListener('touchstart', (e) => {
            if (!isPlaying || isPaused) return;
            e.preventDefault();
            isSwiping = true;
            const touch = e.touches[0];
            addTrailPoint(touch.clientX, touch.clientY);
        }, {passive: false});
        canvas.addEventListener('touchmove', (e) => {
            if (!isPlaying || !isSwiping || isPaused) return;
            e.preventDefault();
            const touch = e.touches[0];
            addTrailPoint(touch.clientX, touch.clientY);
        }, {passive: false});
        window.addEventListener('touchend', () => {
            isSwiping = false;
            clearTrail();
        });

        function drawBlade() {
            if (bladeTrail.length < 2) return;
            
            ctx.beginPath();
            ctx.moveTo(bladeTrail[0].x, bladeTrail[0].y);
            
            for (let i = 1; i < bladeTrail.length; i++) {
                ctx.lineTo(bladeTrail[i].x, bladeTrail[i].y);
            }
            
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.lineWidth = 10;
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.8)';
            ctx.stroke();
            
            ctx.lineWidth = 4;
            ctx.strokeStyle = 'rgba(103, 232, 249, 1)';
            ctx.stroke();
        }

        function checkCollisions() {
            if (bladeTrail.length < 2) return;
            const p1 = bladeTrail[bladeTrail.length - 2];
            const p2 = bladeTrail[bladeTrail.length - 1];
            
            const velocityVector = { x: p2.x - p1.x, y: p2.y - p1.y };

            for (let i = 0; i < fruits.length; i++) {
                let f = fruits[i];
                if (f.isCut) continue;

                const dist = distToSegment(f, p1, p2);
                if (dist < f.radius) {
                    f.cut(velocityVector);
                }
            }
        }

        function distToSegment(p, v, w) {
            const l2 = dist2(v, w);
            if (l2 === 0) return Math.sqrt(dist2(p, v));
            let t = ((p.x - v.x) * (w.x - v.x) + (p.y - v.y) * (w.y - v.y)) / l2;
            t = Math.max(0, Math.min(1, t));
            return Math.sqrt(dist2(p, { x: v.x + t * (w.x - v.x), y: v.y + t * (w.y - v.y) }));
        }
        function dist2(v, w) {
            return Math.pow(v.x - w.x, 2) + Math.pow(v.y - w.y, 2);
        }

        function updateLivesDisplay() {
            let hearts = "";
            for(let i = 0; i < lives; i++) hearts += "❤️";
            for(let i = lives; i < 3; i++) hearts += "🖤";
            document.getElementById('livesDisplay').innerText = hearts;
        }

        function updateCollectionHUD() {
            const modeText = document.getElementById('collectionModeText');
            const counterWrapper = document.getElementById('collectionCounterWrapper');

            if (currentLesson === 0) {
                modeText.innerText = t('comprehensive_mode');
                modeText.classList.remove('hidden');
                counterWrapper.classList.add('hidden');
                return;
            }

            modeText.classList.add('hidden');
            counterWrapper.classList.remove('hidden');

            let collected = 0;
            let total = currentVocabList.length;
            let gridHtml = '';

            currentVocabList.forEach(w => {
                let count = wordCollection[w] || 0;
                if (count > 0) collected++;
                let statusClass = count > 0 ? "bg-green-900 border-green-500 text-green-200" : "bg-gray-800 border-gray-700 text-gray-500";
                let badge = count > 0 ? `<span class="text-xs bg-green-600 text-white px-1.5 py-0.5 rounded-full ml-1">x${count}</span>` : `<span class="text-xs bg-gray-700 text-gray-400 px-1.5 py-0.5 rounded-full ml-1">${t('uncollected')}</span>`;
                
                gridHtml += `<div class="flex items-center justify-between p-2 rounded-lg border ${statusClass}">
                    <span class="font-bold text-sm">${w}</span>
                    ${badge}
                </div>`;
            });

            document.getElementById('collectedCount').innerText = collected;
            document.getElementById('totalCount').innerText = total;
            document.getElementById('vocabGrid').innerHTML = gridHtml;
        }

        function pickNewTargetWord() {
            if (currentLesson !== 0) {
                // 優先選擇尚未收集的生詞
                let uncollected = currentVocabList.filter(w => !wordCollection[w]);
                if (uncollected.length > 0) {
                    targetWord = uncollected[Math.floor(Math.random() * uncollected.length)];
                } else {
                    targetWord = currentVocabList[Math.floor(Math.random() * currentVocabList.length)];
                }
            } else {
                targetWord = currentVocabList[Math.floor(Math.random() * currentVocabList.length)];
            }
            
            updateTargetUI();
            replayTargetAudio();
        }

        function updateTargetUI() {
            const textSpan = document.getElementById('targetWordText');
            textSpan.innerText = targetWord;
            if (isTextHidden) {
                textSpan.classList.add('blur-md');
                textSpan.classList.remove('blur-none');
            } else {
                textSpan.classList.remove('blur-md');
                textSpan.classList.add('blur-none');
            }
        }

        function replayTargetAudio() {
            if (targetWord) {
                speakWord(targetWord);
            }
        }

        function toggleWordVisibility() {
            isTextHidden = !isTextHidden;
            updateTargetUI();
        }

        function toggleVocabModal() {
            const modal = document.getElementById('vocabModal');
            modal.classList.toggle('hidden');
        }

        function togglePause() {
            if (!isPlaying) return;
            isPaused = !isPaused;
            if (isPaused) {
                document.getElementById('pauseScreen').classList.remove('hidden');
            } else {
                document.getElementById('pauseScreen').classList.add('hidden');
                gameLoop(); // 恢復遊戲迴圈
            }
        }

        function quitGame() {
            isPaused = false;
            isPlaying = false;
            cancelAnimationFrame(animationId);
            document.getElementById('pauseScreen').classList.add('hidden');
            document.getElementById('gameControls').classList.add('hidden');
            backToMenu();
        }

        let frameCount = 0;
        function gameLoop() {
            if (!isPlaying || isPaused) return;
            
            ctx.clearRect(0, 0, width, height);
            
            frameCount++;
            let spawnRate = Math.max(20, 80 - Math.floor(score / 5));
            if (frameCount % spawnRate === 0) {
                let numToSpawn = Math.random() > 0.7 ? 2 : 1;
                if(score > 40 && Math.random() > 0.7) numToSpawn = 3;
                
                for(let i=0; i<numToSpawn; i++) {
                    let bombChance = gameFlags.hard ? 0.25 : 0.15;
                    if (gameFlags.bomb && Math.random() < bombChance) {
                        fruits.push(new Bomb());
                    } else {
                        // 確保目標生詞有較高機率出現
                        let spawnTarget = Math.random() < 0.4; // 40% 機率直接產生目標生詞
                        if (spawnTarget && targetWord) {
                            fruits.push(new WordFruit(targetWord));
                        } else {
                            fruits.push(new WordFruit());
                        }
                    }
                }
            }

            for (let i = fruits.length - 1; i >= 0; i--) {
                let f = fruits[i];
                f.update();
                f.draw();
                
                if (f.isCut && f.isBomb) {
                    fruits.splice(i, 1);
                    continue;
                }

                if (f.y > height + f.radius * 2) {
                    if (!f.isCut) {
                        if (!f.isBomb) {
                            if (f.word === targetWord) {
                                // 漏掉了目標生詞，扣命
                                lives--;
                                updateLivesDisplay();
                                
                                ctx.fillStyle = 'rgba(255, 0, 0, 0.3)';
                                ctx.fillRect(0, 0, width, height);

                                splashTexts.push(new SplashText(t('missed'), width/2, height - 100, '#FF3B30'));

                                if (lives <= 0) {
                                    endGame();
                                }
                            }
                            // 若漏掉的不是目標生詞，則安全無事不扣命
                        }
                    }
                    fruits.splice(i, 1);
                }
            }

            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].update();
                particles[i].draw();
                if (particles[i].life <= 0) particles.splice(i, 1);
            }

            for (let i = splashTexts.length - 1; i >= 0; i--) {
                splashTexts[i].update();
                splashTexts[i].draw();
                if (splashTexts[i].life <= 0) splashTexts.splice(i, 1);
            }

            drawBlade();
            
            if (!isSwiping && bladeTrail.length > 0) {
                bladeTrail.shift();
            }

            if (announcement.life > 0) {
                ctx.save();
                let alpha = Math.min(1, announcement.life / 30);
                ctx.globalAlpha = alpha;
                ctx.fillStyle = '#fff';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.font = "900 36px 'Noto Sans TC'";
                ctx.shadowColor = 'rgba(0,0,0,0.8)';
                ctx.shadowBlur = 10;
                ctx.fillText(announcement.text, width / 2, height / 3);
                ctx.restore();
                announcement.life--;
            }

            if(isPlaying) {
                animationId = requestAnimationFrame(gameLoop);
            }
        }

        function startGame(lessonIndex = 0) {
            initToneAudio(); 

            if ('speechSynthesis' in window) {
                let silentUtterance = new SpeechSynthesisUtterance('');
                window.speechSynthesis.speak(silentUtterance);
            }

            currentLesson = lessonIndex;
            if (lessonIndex === 0) {
                currentVocabList = Object.values(lessonData).flat();
                document.getElementById('vocabBtn').classList.add('hidden');
            } else {
                currentVocabList = lessonData[lessonIndex];
                wordCollection = {};
                currentVocabList.forEach(w => wordCollection[w] = 0);
                document.getElementById('modalLessonNum').innerText = lessonIndex;
                document.getElementById('vocabBtn').classList.remove('hidden');
                updateCollectionHUD();
            }

            document.getElementById('startScreen').classList.add('hidden');
            document.getElementById('gameOverScreen').classList.add('hidden');
            document.getElementById('winScreen').classList.add('hidden');
            document.getElementById('targetUI').classList.remove('hidden');
            document.getElementById('gameControls').classList.remove('hidden');
            document.querySelector('.lang-btn').classList.add('hidden');
            
            score = 0;
            lives = 3;
            fruits = [];
            particles = [];
            splashTexts = [];
            bladeTrail = [];
            gameFlags = { bounce: false, bomb: false, hard: false };
            announcement.life = 0;

            document.getElementById('scoreDisplay').innerText = score;
            updateLivesDisplay();
            
            isPlaying = true;
            frameCount = 0;
            
            // 延遲一下再出題並發音，讓玩家準備好
            targetWord = "";
            document.getElementById('targetWordText').innerText = t('ready');
            setTimeout(() => pickNewTargetWord(), 1000);

            gameLoop();
        }

        function resetGame() {
            startGame(currentLesson);
        }

        function endGame() {
            isPlaying = false;
            cancelAnimationFrame(animationId);
            document.getElementById('vocabBtn').classList.add('hidden');
            document.getElementById('targetUI').classList.add('hidden');
            document.getElementById('gameControls').classList.add('hidden');
            document.getElementById('finalScore').innerText = score;
            document.getElementById('gameOverScreen').classList.remove('hidden');
            document.querySelector('.lang-btn').classList.remove('hidden');
        }

        function winGame() {
            isPlaying = false;
            cancelAnimationFrame(animationId);
            document.getElementById('vocabBtn').classList.add('hidden');
            document.getElementById('targetUI').classList.add('hidden');
            document.getElementById('gameControls').classList.add('hidden');
            document.getElementById('winLessonText').innerText = currentLesson;
            document.getElementById('winScreen').classList.remove('hidden');
            document.querySelector('.lang-btn').classList.remove('hidden');
            speakWord(t('win_speech'));
        }

        function backToMenu() {
            document.getElementById('gameOverScreen').classList.add('hidden');
            document.getElementById('winScreen').classList.add('hidden');
            document.getElementById('vocabModal').classList.add('hidden');
            document.getElementById('vocabBtn').classList.add('hidden');
            document.getElementById('targetUI').classList.add('hidden');
            document.getElementById('gameControls').classList.add('hidden');
            document.getElementById('startScreen').classList.remove('hidden');
            document.querySelector('.lang-btn').classList.remove('hidden');
            
            ctx.fillStyle = '#1a202c';
            ctx.fillRect(0, 0, width, height);
            score = 0;
            lives = 3;
            document.getElementById('scoreDisplay').innerText = score;
            updateLivesDisplay();
        }

        function nextLesson() {
            let next = currentLesson + 1;
            if (next > 12) {
                next = 0; 
            }
            startGame(next);
        }
        
        ctx.fillStyle = '#1a202c';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
    </script>
</body>
</html>
